name: OSAH AI PR Review

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:

  ai-review:

    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Verify Claude CLI
        run: |
          claude --version

      - name: Run AI Review
        run: npm run review