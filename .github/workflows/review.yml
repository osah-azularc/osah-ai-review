name: OSAH AI PR Review

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:

    runs-on: ubuntu-latest

    steps:

      #########################################################
      # Checkout the repository that triggered the workflow
      #########################################################

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      #########################################################
      # Checkout AI Review Repository
      #########################################################

      - name: Checkout AI Review Repository
        uses: actions/checkout@v4
        with:
          repository: osah-azularc/osah-ai-review
          token: ${{ github.token }}
          path: ai-review

      #########################################################
      # Setup Node
      #########################################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      #########################################################
      # Install Claude Code
      #########################################################

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      #########################################################
      # Verify Claude Code
      #########################################################

      - name: Verify Claude Code
        run: claude --version

      #########################################################
      # Install AI Review dependencies
      #########################################################

      - name: Install AI Review Dependencies
        working-directory: ai-review
        run: npm install

      #########################################################
      # Run AI Review
      #########################################################

      - name: Run AI Review
        working-directory: ai-review
        run: npm run review
        env:
          TARGET_REPO: ../target
          GITHUB_TOKEN: ${{ github.token }}

          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

          CLAUDE_MODEL: sonnet
